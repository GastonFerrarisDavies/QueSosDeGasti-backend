services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gasti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasti}
      POSTGRES_DB: ${POSTGRES_DB:-quesosdegasti}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Levanta el servidor y descarga el modelo de embeddings la primera vez
    # (all-minilm = sentence-transformers/all-MiniLM-L6-v2, 384 dimensiones).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${EMBEDDING_MODEL:-all-minilm}
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q ${EMBEDDING_MODEL:-all-minilm}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-gasti}:${POSTGRES_PASSWORD:-gasti}@db:5432/${POSTGRES_DB:-quesosdegasti}?sslmode=disable
      OLLAMA_URL: http://llm:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy

volumes:
  ollama_models:
